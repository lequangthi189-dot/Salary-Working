<!doctype html>
<!-- data-theme/data-font đặt sẵn ở đây để lần tải đầu KHÔNG rơi về :root (bảng
     navy cũ) trong khoảng thời gian trước khi src/lib/theme.js chạy. JS vẫn ghi
     đè theo localStorage / hồ sơ như cũ. lang giữ "en" đúng theo mặc định của
     src/lib/i18n.jsx. -->
<html lang="en" data-theme="dark" data-font="md">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <title>Salary Working — Timesheet</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
