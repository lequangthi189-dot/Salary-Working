<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="styles.css">
<style>
html,body{margin:0;height:854px;width:1280px}
body{display:flex;font-family:var(--font-sans);background:var(--sw-navy-900)}
.main{flex:0 0 75%;display:grid;place-items:center;background:var(--sw-navy-900);padding:0 48px}
.name{font-size:150px;line-height:1;font-weight:800;letter-spacing:-6px;color:#f3f8fd;white-space:nowrap}
.name em{font-style:normal;color:#ff9f43}
.strip{flex:1;display:flex;flex-direction:column}
.strip span{flex:1;display:block}
</style>
</head>
<body>
<div class="main"><div class="name">Salary<em>Working</em></div></div>
<div class="strip">
<span style="background:#4fd6a0"></span>
<span style="background:#ff9f43"></span>
<span style="background:#5b9ec6"></span>
<span style="background:#B03A55"></span>
</div>
</body>
</html>
