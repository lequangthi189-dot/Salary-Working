<!-- @dsCard group="Components" viewport="700x560" name="Feedback" subtitle="Progress, skeletons, messages, empty state, loader, modal" -->
<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>
body{margin:0;padding:18px;background:var(--bg);color:var(--text);font-family:var(--font-sans)}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:14px}
.row:last-child{margin-bottom:0}
.cap{width:100%;font-size:0.68rem;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;color:var(--muted);margin:0 0 2px}
a{color:var(--accent)}a:hover{color:var(--text)}
@keyframes sw-skeleton-shimmer{100%{transform:translateX(100%)}}
@keyframes sw-ball{0%{top:0}50%{top:60px}100%{top:0}}
@keyframes sw-shadow{0%{transform:scale(1);opacity:.3}50%{transform:scale(.5);opacity:.1}100%{transform:scale(1);opacity:.3}}
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
</head>
<body><div id="root"></div>
<script type="text/babel">
const NS = window.SalaryWorkingDesignSystem_f6e8d6;
const { Modal, ProgressButton, Skeleton, EmptyState, Message, Loader, Button } = NS;
function Card(){
  return (<div>
    <div className="row"><p className="cap">Progress steps (image import / reconcile)</p>
      <ProgressButton value={62} label="Reading schedule…"/>
      <ProgressButton indeterminate label="Cross-checking with OCR…"/>
      <ProgressButton value={100} label="Done"/>
    </div>
    <div className="row"><p className="cap">Loading shapes · messages</p>
      <div style={{flex:'1 1 15rem',display:'flex',flexDirection:'column',gap:8}}>
        <Skeleton width="8rem" height="0.8rem"/>
        <Skeleton width="11rem" height="2.2rem"/>
        <Skeleton variant="text" lines={2} width="70%"/>
      </div>
      <div style={{flex:'1 1 14rem'}}>
        <Message tone="error">Wrong email or password.</Message>
        <Message tone="info">Sent a password reset link to you@example.com.</Message>
        <EmptyState>No shifts yet. Add your first one above.</EmptyState>
      </div>
      <div style={{flex:'0 0 auto',transform:'scale(0.72)',transformOrigin:'center'}}><Loader label="Loading…"/></div>
    </div>
    <div className="row"><p className="cap">Modal (rendered inline for the specimen)</p>
      <div style={{position:'relative',transform:'translateZ(0)',flex:'1 1 100%',height:190,border:'1px dashed var(--border)',borderRadius:12,overflow:'hidden'}}>
        <Modal title="Delete this shift?" onClose={()=>{}} style={{maxWidth:320}}
          footer={<><Button variant="save" style={{flex:1}}>Yes</Button><Button variant="cancel" style={{flex:1}}>No</Button></>}>
          <p style={{margin:0,fontSize:'var(--text-base)',color:'var(--muted)'}}>This action cannot be undone.</p>
        </Modal>
      </div>
    </div>
  </div>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<Card/>);
</script>
</body>
</html>
