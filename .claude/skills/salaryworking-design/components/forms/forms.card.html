<!-- @dsCard group="Components" viewport="700x400" name="Forms" subtitle="Buttons, fields, 24h time inputs, checkbox, search + filter chips" -->
<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>
body{margin:0;padding:18px;background:var(--bg);color:var(--text);font-family:var(--font-sans)}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:14px}
.row:last-child{margin-bottom:0}
.cap{width:100%;font-size:0.68rem;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;color:var(--muted);margin:0 0 2px}
a{color:var(--accent)}a:hover{color:var(--text)}
@keyframes sw-skeleton-shimmer{100%{transform:translateX(100%)}}
@keyframes sw-ball{0%{top:0}50%{top:60px}100%{top:0}}
@keyframes sw-shadow{0%{transform:scale(1);opacity:.3}50%{transform:scale(.5);opacity:.1}100%{transform:scale(1);opacity:.3}}
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
</head>
<body><div id="root"></div>
<script type="text/babel">
const NS = window.SalaryWorkingDesignSystem_f6e8d6;
const { Button, TextField, TimeInput, Checkbox, SearchInput } = NS;
function Card(){
  const [t1,setT1]=React.useState('21:45');
  const [t2,setT2]=React.useState('06:10');
  const [t3,setT3]=React.useState('22:00');
  const [hol,setHol]=React.useState(true);
  const [q,setQ]=React.useState('14/8');
  const [f,setF]=React.useState('all');
  return (<div>
    <div className="row"><p className="cap">Buttons</p>
      <Button variant="primary">Add shift</Button>
      <Button variant="received">Salary received</Button>
      <Button variant="save">Save</Button>
      <Button variant="cancel">Cancel</Button>
      <Button variant="primary" disabled>Adding…</Button>
      <Button variant="link">Forgot password?</Button>
    </div>
    <div className="row"><p className="cap">Fields · 24h time inputs · checkbox</p>
      <TextField label="Email" type="email" defaultValue="cong@xuong.vn" style={{flex:'1 1 11rem'}}/>
      <TimeInput kind="in" value={t1} onChange={setT1} label="In"/>
      <TimeInput kind="out" value={t2} onChange={setT2} label="Out"/>
      <TimeInput kind="scheduled" value={t3} onChange={setT3} label="Sched in"/>
      <Checkbox checked={hol} onChange={e=>setHol(e.target.checked)} label="Holiday"/>
      <Checkbox checked={false} onChange={()=>{}} label="Off"/>
    </div>
    <div className="row"><p className="cap">Search + filter chips (they narrow together)</p>
      <SearchInput value={q} onChange={e=>setQ(e.target.value)} onClear={()=>setQ('')}/>
      <div style={{display:'flex',gap:'0.4rem'}}>
        {['all','day','night'].map(k=>(<Button key={k} variant="filter" active={f===k} onClick={()=>setF(k)}>{k==='all'?'All':k==='day'?'Day shifts':'Night shifts'}</Button>))}
      </div>
    </div>
    <div className="row"><p className="cap">Error state</p>
      <TextField label="Amount" numeric defaultValue="0" error="Enter a deduction amount (> 0)." style={{flex:'1 1 12rem'}}/>
    </div>
  </div>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<Card/>);
</script>
</body>
</html>
