<!-- @dsCard group="Components" viewport="700x360" name="Navigation" subtitle="Bottom dock, filter and week chips, theme / language cyclers with flags" -->
<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>
body{margin:0;padding:18px;background:var(--bg);color:var(--text);font-family:var(--font-sans)}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:14px}
.row:last-child{margin-bottom:0}
.cap{width:100%;font-size:0.68rem;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;color:var(--muted);margin:0 0 2px}
a{color:var(--accent)}a:hover{color:var(--text)}
@keyframes sw-skeleton-shimmer{100%{transform:translateX(100%)}}
@keyframes sw-ball{0%{top:0}50%{top:60px}100%{top:0}}
@keyframes sw-shadow{0%{transform:scale(1);opacity:.3}50%{transform:scale(.5);opacity:.1}100%{transform:scale(1);opacity:.3}}
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
</head>
<body><div id="root"></div>
<script type="text/babel">
const NS = window.SalaryWorkingDesignSystem_f6e8d6;
const { Dock, FilterTabs, ThemeCycle, Flag } = NS;
function Card(){
  const [a,setA]=React.useState(0);
  const [f,setF]=React.useState('day');
  const [w,setW]=React.useState('w2');
  const [theme,setTheme]=React.useState('dark');
  const [lang,setLang]=React.useState('vi');
  const LANGS={vi:'Tiếng Việt',en:'English (UK)',us:'English (US)',au:'English (AU)'};
  return (<div>
    <div className="row"><p className="cap">Dock — the app's only navigation (shown inline)</p>
      <Dock fixed={false} active={a} onSelect={setA} items={[
        {key:'p',label:'Pay period',icon:'payPeriod'},
        {key:'t',label:'Tools',icon:'tools'},
        {key:'a',label:'Account',icon:'account'},
        {key:'g',label:'Guide',icon:'guide'}
      ]}/>
    </div>
    <div className="row"><p className="cap">Filter chips · week chips</p>
      <FilterTabs value={f} onChange={setF} options={[{value:'all',label:'All'},{value:'day',label:'Day shifts'},{value:'night',label:'Night shifts'}]}/>
      <FilterTabs value={w} onChange={setW} options={[{value:'all',label:'All'},{value:'w1',label:'Week 1'},{value:'w2',label:'Week 2'},{value:'w3',label:'Week 3'}]}/>
    </div>
    <div className="row"><p className="cap">Theme + language cyclers</p>
      <ThemeCycle value={theme} onChange={setTheme}/>
      <ThemeCycle value={theme} onChange={setTheme} showLabel={false}/>
      <ThemeCycle value={lang} order={['vi','en','us','au']} label={LANGS[lang]} onChange={setLang} icon={Flag ? <Flag code={lang}/> : null}/>
      <ThemeCycle value={lang} order={['vi','en','us','au']} label={LANGS[lang]} onChange={setLang} icon={Flag ? <Flag code={lang}/> : null} showLabel={false}/>
      <span style={{display:'flex',gap:8,alignItems:'center',marginLeft:4}}>
        {Flag && ['vi','en','us','au'].map(c=>(<span key={c} style={{display:'flex',alignItems:'center',gap:4,fontSize:'0.68rem',color:'var(--muted)'}}><Flag code={c} width={22}/>{{vi:'₫',en:'£',us:'$',au:'A$'}[c]}</span>))}
      </span>
    </div>
  </div>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<Card/>);
</script>
</body>
</html>
