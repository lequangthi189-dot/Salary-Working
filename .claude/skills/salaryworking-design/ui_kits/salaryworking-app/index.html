<!doctype html>
<html lang="en" data-theme="dark" data-font="md">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SalaryWorking — app UI kit</title>
<link rel="stylesheet" href="../../styles.css">
<style>
html,body{min-height:100%}
html{background:var(--bg)}
body{margin:0;background:var(--bg);background-image:var(--page-bg-image);background-attachment:fixed;color:var(--text);font-family:var(--font-sans);-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
*{scrollbar-width:none}*::-webkit-scrollbar{display:none}
html[data-font='sm']{font-size:87.5%}html[data-font='md']{font-size:100%}html[data-font='lg']{font-size:112.5%}
a{color:var(--accent)}a:hover{color:var(--text)}
@media (max-width:760px){.board-grid{grid-template-columns:1fr !important}}
@keyframes sw-skeleton-shimmer{100%{transform:translateX(100%)}}
@keyframes sw-ball{0%{top:0}50%{top:60px}100%{top:0}}
@keyframes sw-shadow{0%{transform:scale(1);opacity:.3}50%{transform:scale(.5);opacity:.1}100%{transform:scale(1);opacity:.3}}
#root{min-height:100vh}
</style>
