<!-- @dsCard group="Colors" viewport="700x190" name="Glass theme" subtitle="Aurora ground, translucent white surfaces, gradient hairline" -->
<!doctype html>
<html lang="en" data-theme="glass">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
body{margin:0;padding:16px;background:var(--bg);background-image:var(--page-bg-image);color:var(--text);font-family:var(--font-sans);font-size:14px}
.g{display:flex;flex-wrap:wrap;gap:8px}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.lbl{font-size:0.68rem;color:var(--muted);letter-spacing:0.04em}
a{color:var(--accent)}a:hover{color:var(--text)}
.sw{flex:1 1 96px;min-width:96px;border-radius:8px;overflow:hidden;border:1px solid var(--border)}
.sw .chip{height:52px}
.sw .meta{padding:5px 7px;background:var(--panel);display:flex;flex-direction:column;gap:1px}
.sw .n{font-size:0.72rem;font-weight:600}
.sw .v{font-family:var(--font-mono);font-size:0.62rem;color:var(--muted)}
</style>
</head>
<body>
<div class="g">
<div class="sw"><div class="chip" style="background:var(--accent)"></div><div class="meta"><span class="n">--accent</span><span class="v">#7cc4ff</span></div></div>
<div class="sw"><div class="chip" style="background:var(--green)"></div><div class="meta"><span class="n">--green</span><span class="v">#5ff0a8</span></div></div>
<div class="sw"><div class="chip" style="background:var(--danger)"></div><div class="meta"><span class="n">--danger</span><span class="v">#ff7d97</span></div></div>
<div class="sw"><div class="chip" style="background:var(--sw-aurora-violet)"></div><div class="meta"><span class="n">aurora violet</span><span class="v">#a855f7</span></div></div>
<div class="sw"><div class="chip" style="background:var(--sw-aurora-cyan)"></div><div class="meta"><span class="n">aurora cyan</span><span class="v">#22d3ee</span></div></div>
<div class="sw"><div class="chip" style="background:var(--sw-aurora-pink)"></div><div class="meta"><span class="n">aurora pink</span><span class="v">#ec4899</span></div></div>
</div>
<div style="margin-top:10px;background:var(--card-bg);background-image:var(--card-bg-image);border:var(--card-border);border-radius:var(--card-radius);box-shadow:var(--card-shadow);backdrop-filter:var(--card-blur);padding:10px 12px">
<span class="lbl">FROSTED SURFACE · 18px · blur(18px) saturate(150%)</span>
<div class="mono" style="font-size:1.2rem;font-weight:800">7.480.000</div>
</div>
</body>
</html>
