<!-- @dsCard group="Colors" viewport="700x150" name="Stat tones" subtitle="Four label tones on the month block, each bound to one metric" -->
<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
body{margin:0;padding:16px;background:var(--bg);background-image:var(--page-bg-image);color:var(--text);font-family:var(--font-sans);font-size:14px}
.g{display:flex;flex-wrap:wrap;gap:8px}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.lbl{font-size:0.68rem;color:var(--muted);letter-spacing:0.04em}
a{color:var(--accent)}a:hover{color:var(--text)}
.sw{flex:1 1 96px;min-width:96px;border-radius:8px;overflow:hidden;border:1px solid var(--border)}
.sw .chip{height:52px}
.sw .meta{padding:5px 7px;background:var(--panel);display:flex;flex-direction:column;gap:1px}
.sw .n{font-size:0.72rem;font-weight:600}
.sw .v{font-family:var(--font-mono);font-size:0.62rem;color:var(--muted)}
</style>
</head>
<body>
<div class="g">
<div class="sw"><div class="chip" style="background:var(--tone-orange)"></div><div class="meta"><span class="n">--tone-orange</span><span class="v">total hours · day shifts</span></div></div>
<div class="sw"><div class="chip" style="background:var(--tone-green)"></div><div class="meta"><span class="n">--tone-green</span><span class="v">day hours · salary</span></div></div>
<div class="sw"><div class="chip" style="background:var(--tone-blue)"></div><div class="meta"><span class="n">--tone-blue</span><span class="v">night hours · night shifts</span></div></div>
<div class="sw"><div class="chip" style="background:var(--tone-red)"></div><div class="meta"><span class="n">--tone-red</span><span class="v">late hours</span></div></div>
</div>
</body>
</html>
