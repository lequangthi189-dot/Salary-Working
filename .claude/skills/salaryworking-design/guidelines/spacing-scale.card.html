<!-- @dsCard group="Spacing" viewport="700x190" name="Scale" subtitle="The rem ladder the product actually uses — dense by intent" -->
<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
body{margin:0;padding:16px;background:var(--bg);background-image:var(--page-bg-image);color:var(--text);font-family:var(--font-sans);font-size:14px}
.g{display:flex;flex-wrap:wrap;gap:8px}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.lbl{font-size:0.68rem;color:var(--muted);letter-spacing:0.04em}
a{color:var(--accent)}a:hover{color:var(--text)}

</style>
</head>
<body>
<div style="display:flex;flex-direction:column;gap:5px">
<div style="display:flex;align-items:center;gap:8px"><span class="mono" style="flex:0 0 92px;font-size:0.66rem;color:var(--muted)">--space-2</span><span style="height:9px;width:0.25rem;background:var(--accent);border-radius:2px"></span><span class="mono" style="font-size:0.66rem;color:var(--muted)">0.25rem</span></div>
<div style="display:flex;align-items:center;gap:8px"><span class="mono" style="flex:0 0 92px;font-size:0.66rem;color:var(--muted)">--space-4</span><span style="height:9px;width:0.4rem;background:var(--accent);border-radius:2px"></span><span class="mono" style="font-size:0.66rem;color:var(--muted)">0.4rem</span></div>
<div style="display:flex;align-items:center;gap:8px"><span class="mono" style="flex:0 0 92px;font-size:0.66rem;color:var(--muted)">--space-5</span><span style="height:9px;width:0.5rem;background:var(--accent);border-radius:2px"></span><span class="mono" style="font-size:0.66rem;color:var(--muted)">0.5rem</span></div>
<div style="display:flex;align-items:center;gap:8px"><span class="mono" style="flex:0 0 92px;font-size:0.66rem;color:var(--muted)">--space-6</span><span style="height:9px;width:0.6rem;background:var(--accent);border-radius:2px"></span><span class="mono" style="font-size:0.66rem;color:var(--muted)">0.6rem</span></div>
<div style="display:flex;align-items:center;gap:8px"><span class="mono" style="flex:0 0 92px;font-size:0.66rem;color:var(--muted)">--space-8</span><span style="height:9px;width:0.75rem;background:var(--accent);border-radius:2px"></span><span class="mono" style="font-size:0.66rem;color:var(--muted)">0.75rem</span></div>
<div style="display:flex;align-items:center;gap:8px"><span class="mono" style="flex:0 0 92px;font-size:0.66rem;color:var(--muted)">--space-9</span><span style="height:9px;width:0.85rem;background:var(--accent);border-radius:2px"></span><span class="mono" style="font-size:0.66rem;color:var(--muted)">0.85rem</span></div>
<div style="display:flex;align-items:center;gap:8px"><span class="mono" style="flex:0 0 92px;font-size:0.66rem;color:var(--muted)">--space-10</span><span style="height:9px;width:1rem;background:var(--accent);border-radius:2px"></span><span class="mono" style="font-size:0.66rem;color:var(--muted)">1rem</span></div>
<div style="display:flex;align-items:center;gap:8px"><span class="mono" style="flex:0 0 92px;font-size:0.66rem;color:var(--muted)">--space-12</span><span style="height:9px;width:1.25rem;background:var(--accent);border-radius:2px"></span><span class="mono" style="font-size:0.66rem;color:var(--muted)">1.25rem</span></div>
<div style="display:flex;align-items:center;gap:8px"><span class="mono" style="flex:0 0 92px;font-size:0.66rem;color:var(--muted)">--space-14</span><span style="height:9px;width:1.5rem;background:var(--accent);border-radius:2px"></span><span class="mono" style="font-size:0.66rem;color:var(--muted)">1.5rem</span></div>
<div style="display:flex;align-items:center;gap:8px"><span class="mono" style="flex:0 0 92px;font-size:0.66rem;color:var(--muted)">--space-16</span><span style="height:9px;width:2rem;background:var(--accent);border-radius:2px"></span><span class="mono" style="font-size:0.66rem;color:var(--muted)">2rem</span></div>
</div>
</body>
</html>
