<!-- @dsCard group="Colors" viewport="700x190" name="Soft UI theme" subtitle="Light room, no borders — light top-left, shade bottom-right" -->
<!doctype html>
<html lang="en" data-theme="neumorph">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
body{margin:0;padding:16px;background:var(--bg);background-image:var(--page-bg-image);color:var(--text);font-family:var(--font-sans);font-size:14px}
.g{display:flex;flex-wrap:wrap;gap:8px}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.lbl{font-size:0.68rem;color:var(--muted);letter-spacing:0.04em}
a{color:var(--accent)}a:hover{color:var(--text)}
.sw{flex:1 1 96px;min-width:96px;border-radius:8px;overflow:hidden;border:1px solid var(--border)}
.sw .chip{height:52px}
.sw .meta{padding:5px 7px;background:var(--panel);display:flex;flex-direction:column;gap:1px}
.sw .n{font-size:0.72rem;font-weight:600}
.sw .v{font-family:var(--font-mono);font-size:0.62rem;color:var(--muted)}
</style>
</head>
<body>
<div class="g">
<div class="sw"><div class="chip" style="background:var(--bg)"></div><div class="meta"><span class="n">--bg / --panel</span><span class="v">#e0e5ec</span></div></div>
<div class="sw"><div class="chip" style="background:var(--accent)"></div><div class="meta"><span class="n">--accent</span><span class="v">#8ab0e8</span></div></div>
<div class="sw"><div class="chip" style="background:var(--green)"></div><div class="meta"><span class="n">--green</span><span class="v">#7ed0b0</span></div></div>
<div class="sw"><div class="chip" style="background:var(--danger)"></div><div class="meta"><span class="n">--danger</span><span class="v">#f0a79b</span></div></div>
<div class="sw"><div class="chip" style="background:var(--sw-nm-sky)"></div><div class="meta"><span class="n">sky tile</span><span class="v">#c6dcf5</span></div></div>
<div class="sw"><div class="chip" style="background:var(--sw-nm-mint)"></div><div class="meta"><span class="n">mint tile</span><span class="v">#bce7d4</span></div></div>
</div>
<div style="margin-top:10px;display:flex;gap:10px;align-items:center">
<div style="flex:1;background:var(--nm-convex);border-radius:20px;box-shadow:var(--nm-shadow);padding:10px 12px"><span class="lbl">RAISED · --nm-shadow</span><div class="mono" style="font-size:1.2rem;font-weight:800">7.480.000</div></div>
<div style="flex:0 0 130px;background:var(--bg);border-radius:12px;box-shadow:var(--nm-inset);padding:10px 12px"><span class="lbl">INSET · input</span><div class="mono">22:00</div></div>
</div>
</body>
</html>
