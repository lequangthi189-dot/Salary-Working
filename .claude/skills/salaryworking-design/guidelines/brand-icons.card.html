<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
body{margin:0;padding:16px;background:var(--bg);background-image:var(--page-bg-image);color:var(--text);font-family:var(--font-sans);font-size:14px}
.g{display:flex;flex-wrap:wrap;gap:8px}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.lbl{font-size:0.68rem;color:var(--muted);letter-spacing:0.04em}
a{color:var(--accent)}a:hover{color:var(--text)}

</style>
</head>
<body>
<div style="display:flex;flex-wrap:wrap;gap:18px;align-items:flex-start">
<div style="display:flex;flex-direction:column;align-items:center;gap:5px;width:78px;text-align:center"><img src="../assets/icons/calendar-days.svg" width="26" height="26" style="filter:invert(1) brightness(1.4)" alt="calendar-days"><span class="lbl">Pay period</span></div>
<div style="display:flex;flex-direction:column;align-items:center;gap:5px;width:78px;text-align:center"><img src="../assets/icons/wrench.svg" width="26" height="26" style="filter:invert(1) brightness(1.4)" alt="wrench"><span class="lbl">Tools</span></div>
<div style="display:flex;flex-direction:column;align-items:center;gap:5px;width:78px;text-align:center"><img src="../assets/icons/user.svg" width="26" height="26" style="filter:invert(1) brightness(1.4)" alt="user"><span class="lbl">Account</span></div>
<div style="display:flex;flex-direction:column;align-items:center;gap:5px;width:78px;text-align:center"><img src="../assets/icons/book-open.svg" width="26" height="26" style="filter:invert(1) brightness(1.4)" alt="book-open"><span class="lbl">Guide</span></div>
<div style="display:flex;flex-direction:column;align-items:center;gap:5px;width:78px;text-align:center"><img src="../assets/icons/search.svg" width="26" height="26" style="filter:invert(1) brightness(1.4)" alt="search"><span class="lbl">Search shifts</span></div>
<div style="display:flex;flex-direction:column;align-items:center;gap:5px;width:78px;text-align:center"><img src="../assets/icons/check.svg" width="26" height="26" style="filter:invert(1) brightness(1.4)" alt="check"><span class="lbl">Checkbox tick</span></div>
<div style="display:flex;flex-direction:column;align-items:center;gap:5px;width:78px;text-align:center"><img src="../assets/icons/chevron-down.svg" width="26" height="26" style="filter:invert(1) brightness(1.4)" alt="chevron-down"><span class="lbl">Select</span></div>
</div>
<p style="margin:10px 0 0;font-size:0.7rem;color:var(--muted)">Few icons on purpose. Where words are clearer than a glyph the product uses words — and it never labels a feature "AI".</p>
</body>
</html>
