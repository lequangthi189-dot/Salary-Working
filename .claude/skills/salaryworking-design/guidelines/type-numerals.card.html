<!-- @dsCard group="Type" viewport="700x210" name="Tabular numerals" subtitle="Money and hours are columns first, text second" -->
<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
body{margin:0;padding:16px;background:var(--bg);background-image:var(--page-bg-image);color:var(--text);font-family:var(--font-sans);font-size:14px}
.g{display:flex;flex-wrap:wrap;gap:8px}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.lbl{font-size:0.68rem;color:var(--muted);letter-spacing:0.04em}
a{color:var(--accent)}a:hover{color:var(--text)}

</style>
</head>
<body>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:14px">
<div>
<span class="lbl">TABULAR — CORRECT</span>
<div style="font-variant-numeric:tabular-nums;text-align:right;font-weight:700;font-size:1.05rem;line-height:1.5">
<div>402.900</div><div>1.180.400</div><div>98.600</div><div>7.480.000</div>
</div>
</div>
<div>
<span class="lbl">PROPORTIONAL — WRONG</span>
<div style="font-variant-numeric:proportional-nums;text-align:right;font-weight:700;font-size:1.05rem;line-height:1.5;color:var(--muted)">
<div>402.900</div><div>1.180.400</div><div>98.600</div><div>7.480.000</div>
</div>
</div>
</div>
<p style="margin:10px 0 0;font-size:0.72rem;color:var(--muted)">Put <span class="mono">font-variant-numeric: var(--numeric)</span> on every element that renders money, hours or a clock time.</p>
</body>
</html>
