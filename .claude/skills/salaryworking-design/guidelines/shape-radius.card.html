<!-- @dsCard group="Surfaces" viewport="700x190" name="Radius" subtitle="Radius grows with the surface: 6 controls, 12 cards, 999 chips" -->
<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
body{margin:0;padding:16px;background:var(--bg);background-image:var(--page-bg-image);color:var(--text);font-family:var(--font-sans);font-size:14px}
.g{display:flex;flex-wrap:wrap;gap:8px}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.lbl{font-size:0.68rem;color:var(--muted);letter-spacing:0.04em}
a{color:var(--accent)}a:hover{color:var(--text)}

</style>
</head>
<body>
<div class="g">
<div style="flex:0 0 78px;text-align:center"><div style="height:46px;background:var(--panel-2);border:1px solid var(--border);border-radius:6px"></div><div class="mono" style="font-size:0.62rem;margin-top:3px">6px</div><div class="lbl">inline controls</div></div>
<div style="flex:0 0 78px;text-align:center"><div style="height:46px;background:var(--panel-2);border:1px solid var(--border);border-radius:8px"></div><div class="mono" style="font-size:0.62rem;margin-top:3px">8px</div><div class="lbl">inputs, buttons</div></div>
<div style="flex:0 0 78px;text-align:center"><div style="height:46px;background:var(--panel-2);border:1px solid var(--border);border-radius:10px"></div><div class="mono" style="font-size:0.62rem;margin-top:3px">10px</div><div class="lbl">shift card</div></div>
<div style="flex:0 0 78px;text-align:center"><div style="height:46px;background:var(--panel-2);border:1px solid var(--border);border-radius:12px"></div><div class="mono" style="font-size:0.62rem;margin-top:3px">12px</div><div class="lbl">day card, modal</div></div>
<div style="flex:0 0 78px;text-align:center"><div style="height:46px;background:var(--panel-2);border:1px solid var(--border);border-radius:14px"></div><div class="mono" style="font-size:0.62rem;margin-top:3px">14px</div><div class="lbl">salary hero</div></div>
<div style="flex:0 0 78px;text-align:center"><div style="height:46px;background:var(--panel-2);border:1px solid var(--border);border-radius:18px"></div><div class="mono" style="font-size:0.62rem;margin-top:3px">18px</div><div class="lbl">glass</div></div>
<div style="flex:0 0 78px;text-align:center"><div style="height:46px;background:var(--panel-2);border:1px solid var(--border);border-radius:20px"></div><div class="mono" style="font-size:0.62rem;margin-top:3px">20px</div><div class="lbl">soft UI</div></div>
<div style="flex:0 0 78px;text-align:center"><div style="height:46px;background:var(--panel-2);border:1px solid var(--border);border-radius:999px"></div><div class="mono" style="font-size:0.62rem;margin-top:3px">999px</div><div class="lbl">dock, chips</div></div>
</div>
</body>
</html>
