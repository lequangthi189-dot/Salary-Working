<!-- @dsCard group="Type" viewport="700x180" name="Labels & titles" subtitle="Uppercase, tracked, semibold — the only decorative type move" -->
<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
body{margin:0;padding:16px;background:var(--bg);background-image:var(--page-bg-image);color:var(--text);font-family:var(--font-sans);font-size:14px}
.g{display:flex;flex-wrap:wrap;gap:8px}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.lbl{font-size:0.68rem;color:var(--muted);letter-spacing:0.04em}
a{color:var(--accent)}a:hover{color:var(--text)}

</style>
</head>
<body>
<div style="display:flex;flex-direction:column;gap:10px">
<div><div style="font-size:var(--text-sm);font-weight:700;text-transform:uppercase;letter-spacing:var(--tracking-hero);color:var(--pay-positive)">Salary this month:</div><span class="lbl">0.8rem / 700 / 0.08em · hero label</span></div>
<div><div style="font-size:var(--text-lg);font-weight:700;text-transform:uppercase;letter-spacing:var(--tracking-title);color:var(--accent);border-bottom:2px solid var(--accent);display:inline-block;padding-bottom:3px">Add a shift</div><div class="lbl" style="margin-top:3px">0.95rem / 700 / 0.04em + 2px accent rule · section title</div></div>
<div><div style="font-size:var(--text-xs);text-transform:uppercase;letter-spacing:var(--tracking-label);color:var(--muted)">Total hours</div><span class="lbl">0.72rem / 0.03em · tile label</span></div>
</div>
</body>
</html>
