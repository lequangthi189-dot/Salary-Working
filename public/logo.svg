<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Salary Working">
  <title>Salary Working — Bảng kẹp (clipboard ledger)</title>
  <!--
    Favicon. Không dùng currentColor được vì file này nạp rời (thanh tab của
    trình duyệt không truyền màu vào), nên màu cố định + tự đảo theo giao diện
    hệ điều hành: mực navy trên tab sáng, mực giấy trên tab tối.
    Bản dùng TRONG app là src/components/BrandMark.jsx (nội tuyến, currentColor).
  -->
  <style>
    :root { --ink: #0a1929; --check: #b03a55; }
    @media (prefers-color-scheme: dark) {
      :root { --ink: #f3f8fd; --check: #d9647c; }
    }
  </style>
  <rect x="52" y="56" width="152" height="168" rx="12" fill="none" stroke="var(--ink)" stroke-width="9"/>
  <g fill="var(--ink)">
    <rect x="102" y="34" width="52" height="34" rx="7"/>
    <rect x="115" y="22" width="26" height="16" rx="5"/>
    <rect x="76" y="90" width="104" height="13" rx="2"/>
    <rect x="76" y="118" width="13" height="13" rx="2"/>
    <rect x="76" y="142" width="13" height="13" rx="2"/>
    <rect x="76" y="166" width="13" height="13" rx="2"/>
  </g>
  <g fill="var(--ink)" fill-opacity="0.55">
    <rect x="96" y="120" width="72" height="9" rx="2"/>
    <rect x="96" y="144" width="54" height="9" rx="2"/>
    <rect x="96" y="168" width="64" height="9" rx="2"/>
  </g>
  <path fill="none" stroke="var(--check)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" d="M126 180 L148 202 L198 152"/>
</svg>
